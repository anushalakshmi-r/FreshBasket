databases:
  - name: freshbasket-db
    plan: free
    databaseName: freshbasket
    user: freshbasket

services:
  - type: web
    name: freshbasket-backend
    runtime: python
    plan: free
    buildCommand: bash backend/build.sh
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: freshbasket-backend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: freshbasket-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontend-delta-rouge-76.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: CSRF_TRUSTED_ORIGINS
        value: https://frontend-delta-rouge-76.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: AUTH_REFRESH_COOKIE_SECURE
        value: "True"
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
